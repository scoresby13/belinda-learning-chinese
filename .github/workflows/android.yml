name: Android app

# Builds an installable APK of the app on every push.
# - Every run uploads the APK as a workflow artifact.
# - Pushes to main also publish it to the "android-latest" release, so anyone can
#   download it on their phone from the repository's Releases page.
# Signing: add the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to get a release-signed APK (needed for
# smooth updates and Google Play). Without them a debug-signed APK is built.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set: building a debug-signed APK."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then ./gradlew --no-daemon assembleRelease; else ./gradlew --no-daemon assembleDebug; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/$BUILD_TYPE/*.apk "$GITHUB_WORKSPACE/out/learning-chinese.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-chinese-${{ env.APP_VERSION_NAME }}-${{ env.BUILD_TYPE }}
          path: out/learning-chinese.apk
          retention-days: 30

      - name: Publish to the "android-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app — latest build
          prerelease: true
          make_latest: false
          body: |
            Latest Android build of Learning Chinese (version ${{ env.APP_VERSION_NAME }}, ${{ env.BUILD_TYPE }}-signed), built from ${{ github.sha }}.

            **Install:** open this page on your Android phone, download `learning-chinese.apk`, open it and allow "Install unknown apps" for your browser when asked.
          files: out/learning-chinese.apk
